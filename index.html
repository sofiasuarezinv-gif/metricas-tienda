<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas de Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/themes/dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#08080d;--bg1:#101019;--bg2:#181824;--bg3:#212030;--line:#2a2840;
    --ink:#ece9f5;--sub:#948fb0;--dim:rgba(255,255,255,.06);
    --purple:#a78bfa;--purple2:#7c5cff;--green:#34d399;--red:#f87171;--amber:#f59e0b;--orange:#fb923c;--cyan:#38bdf8;--pink:#f472b6;
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg0);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .side{width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--bg1),var(--bg0));border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
  .brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--purple2),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:19px}
  .brand h1{font-size:16px;font-weight:800;margin:0;line-height:1.1}
  .brand p{margin:0;font-size:10.5px;color:var(--sub)}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer}
  .nav a:hover{background:var(--bg2);color:var(--ink)}
  .nav a.active{background:rgba(124,92,255,.16);color:var(--purple)}
  .nav .sep{height:1px;background:var(--line);margin:10px 4px}
  .main{flex:1;padding:26px 30px;min-width:0}
  @media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:6px}.nav{flex-direction:row;flex-wrap:wrap}.brand{width:100%}}

  h2.title{font-size:22px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  .muted{color:var(--sub);font-size:13px;margin:0 0 20px}
  .chartbtn{font-size:17px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:2px 9px;line-height:1.4}
  .chartbtn:hover{border-color:var(--purple)}

  .filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .filters button{background:var(--bg2);border:1px solid var(--line);color:var(--sub);padding:8px 13px;border-radius:9px;font:600 12.5px "Inter";cursor:pointer}
  .filters button:hover{color:var(--ink)} .filters button.active{background:var(--purple2);border-color:var(--purple2);color:#fff}
  .filters select{background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:9px;font:600 12.5px "Inter"}

  .sec-h{font-size:13px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px}
  .upstat{font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--sub);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-left:8px;white-space:nowrap}
  .upstat.ok{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
  .btnclear{font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--red);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.4);border-radius:20px;padding:2px 10px;margin-left:4px;cursor:pointer}
  .btnclear:hover{background:rgba(248,113,113,.18)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .stat{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative}
  .stat .k{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;gap:6px;align-items:center}
  .stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .stat .s{font-size:11.5px;color:var(--sub);margin-top:6px}
  .stat.pur{border-color:var(--purple2);background:linear-gradient(150deg,rgba(124,92,255,.12),rgba(16,16,25,.5))}
  .stat.pur .v{color:var(--purple)}
  .stat.grn .v{color:var(--green)} .stat.red .v{color:var(--red)} .stat.cyan .v{color:var(--cyan)} .stat.amb .v{color:var(--amber)} .stat.org .v{color:var(--orange)}
  .badge{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;color:var(--amber);background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);padding:2px 7px;border-radius:20px}
  .alertnote{font-size:10px;font-weight:600;color:var(--amber);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:7px;padding:4px 7px;margin-top:8px;line-height:1.3}
  .alertnote.ok{color:var(--green);background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.3)}
  .metanote{font-size:10.5px;font-weight:600;color:var(--sub);margin-top:8px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .metainp{width:52px;background:var(--bg3);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 5px;font:600 11px "Inter";text-align:right;outline:none}
  .metainp:focus{border-color:var(--purple)}
  .rentgroups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  @media(max-width:820px){.rentgroups{grid-template-columns:1fr}}
  .rentgroup{border-radius:16px;padding:14px 14px 16px;border:1px solid var(--line)}
  .rentgroup .cards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .rentgroup-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:2px 2px 12px}
  .rentgroup.blue{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.35)}
  .rentgroup.blue .rentgroup-h{color:var(--cyan)}
  .rentgroup.green{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.35)}
  .rentgroup.green .rentgroup-h{color:var(--green)}
  .secdiv{height:0;border-top:2px dashed var(--line);margin:34px 0 4px;opacity:.7}
  .maintitle{font-size:16.5px;font-weight:800;color:var(--ink);margin:38px 0 14px;padding:12px 16px;background:linear-gradient(90deg,rgba(124,92,255,.16),transparent 70%);border-left:4px solid var(--purple2);border-radius:11px;display:flex;align-items:center;gap:9px}

  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--dim);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);background:var(--bg2)}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
  th .arr{opacity:.5;font-size:9px;margin-left:2px}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums;font-weight:600}
  tr.totals td{background:var(--bg2);font-weight:800;border-top:2px solid var(--line)}
  tr.sel td{background:rgba(124,92,255,.08)}
  .tablewrap{overflow-x:auto}
  .cb{width:15px;height:15px;accent-color:var(--purple2);cursor:pointer;vertical-align:middle}
  .dcell{width:74px;background:var(--bg3);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:4px 6px;font:600 12px "Inter";text-align:right;outline:none;font-variant-numeric:tabular-nums}
  .dcell:focus{border-color:var(--purple);background:var(--bg2)}
  .dcell.ov{border-color:var(--purple2);color:var(--purple)}
  td.cpa{color:var(--amber);font-weight:700}
  th.g-meta{color:var(--cyan)} th.g-dropi{color:var(--purple)} th.g-desp{color:#818cf8} th.g-ent{color:var(--green)}
  .sharebar{display:inline-block;height:7px;border-radius:4px;background:var(--purple2);vertical-align:middle;margin-left:7px;min-width:2px}

  details.acc{background:var(--bg1);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
  details.acc>summary{cursor:pointer;padding:15px 18px;font-weight:700;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:9px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::before{content:"▸";color:var(--purple);font-size:12px;transition:.15s}
  details.acc[open]>summary::before{transform:rotate(90deg)}
  details.acc .acc-body{padding:0 18px 18px}

  .panel{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:660px;box-shadow:var(--shadow)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .field input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:10px 12px;font:500 14px "Inter";outline:none}
  .field input:focus{border-color:var(--purple)}
  .inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .btn{background:var(--purple2);border:none;color:#fff;padding:11px 20px;border-radius:11px;font:700 14px "Inter";cursor:pointer}
  .btn:hover{filter:brightness(1.08)} .btn.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--ink)} .btn.sm{padding:7px 12px;font-size:12.5px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--sub);cursor:pointer;background:var(--bg2)}
  .drop:hover{border-color:var(--purple)}
  .msg{font-size:13px;font-weight:600;margin-top:10px} .msg.ok{color:var(--green)} .msg.err{color:var(--red)}
  .empty{text-align:center;color:var(--sub);padding:50px 20px}
  .hint{font-size:12px;color:var(--amber);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:10px 13px;margin-bottom:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--purple);color:var(--ink);padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:80}
  .toast.show{opacity:1}

  .toggle{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .toggle button{background:var(--bg2);border:1px solid var(--line);color:var(--sub);padding:7px 14px;border-radius:9px;font:600 12.5px "Inter";cursor:pointer}
  .toggle button.active{background:var(--purple2);border-color:var(--purple2);color:#fff}

  /* charts */
  .chartcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .charttitle{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.chartgrid{grid-template-columns:1fr}}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(4,4,10,.72);display:none;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:90;overflow-y:auto}
  .modal.show{display:flex}
  .modal-card{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:900px;width:100%;box-shadow:var(--shadow);position:relative}
  .modal-x{position:absolute;top:14px;right:14px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px}
</style>
<style>
  /* calendario de rango */
  .drange{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(56,189,248,.08));border:1px solid rgba(124,92,255,.45);border-radius:11px;padding:0 12px;height:38px;cursor:pointer;transition:.15s}
  .drange:hover{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .drange .ic{font-size:15px} .drange .car{color:var(--purple);font-size:11px}
  .drange input{background:transparent;border:0;outline:0;color:var(--ink);font:700 13px Inter;width:200px;cursor:pointer}
  .drange input::placeholder{color:var(--sub)}
  .flatpickr-calendar{background:#14141f!important;border:1px solid var(--line)!important;box-shadow:0 20px 50px rgba(0,0,0,.6)!important;border-radius:14px!important}
  .flatpickr-day.selected,.flatpickr-day.startRange,.flatpickr-day.endRange{background:#7c5cff!important;border-color:#7c5cff!important}
  .flatpickr-day.inRange{background:rgba(124,92,255,.22)!important;border-color:transparent!important;box-shadow:-5px 0 0 rgba(124,92,255,.22),5px 0 0 rgba(124,92,255,.22)!important}
  .flatpickr-months .flatpickr-month,.flatpickr-current-month .flatpickr-monthDropdown-months,span.flatpickr-weekday{background:transparent!important;color:var(--ink)!important}
  .ec{width:100%}
  /* gráficas */
  .chartcard{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0;box-shadow:var(--shadow);min-width:0}
  .charttitle{font-size:13px;font-weight:800;color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:4px}
  .chartsub{font-size:12px;color:var(--sub);margin-bottom:12px} .chartsub b{color:var(--ink)}
  .chartgrid{gap:16px}
  svg.tc{width:100%;height:auto;display:block;margin-top:6px} svg.tc .ax{fill:var(--sub);font:500 10.5px Inter} svg.tc .wv{fill:var(--ink);font:700 11px Inter} svg.tc .hz:hover{fill:rgba(255,255,255,.04)}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--sub);margin-top:10px} .lg span{display:flex;align-items:center;gap:6px} .lg b{color:var(--ink)} .lg i{display:inline-block;width:10px;height:10px;border-radius:3px}
  .stk{display:flex;gap:2px;height:34px;border-radius:8px;overflow:hidden;margin-top:6px} .stk div{display:flex;align-items:center;justify-content:center;color:#fff;font:800 12px Inter;min-width:3px}
  .hb{display:flex;flex-direction:column;gap:9px;margin-top:6px} .hbr{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
  .hbl{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbt{height:16px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden} .hbf{height:100%;border-radius:0 4px 4px 0}
  .hbv{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;white-space:nowrap} .hbv small{display:block;font-size:10.5px;font-weight:600;color:var(--sub)}
  #tip{position:fixed;pointer-events:none;opacity:0;z-index:99;background:#1c1b2a;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--ink);box-shadow:var(--shadow);transition:opacity .1s;line-height:1.5}
  #tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  @media(max-width:760px){.hbr{grid-template-columns:90px 1fr auto}}
  /* v2: métricas conectadas */
  .syncbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12px;color:var(--sub)}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-weight:600}
  .chip.ok{color:var(--green);border-color:rgba(52,211,153,.4)} .chip.warn{color:var(--amber);border-color:rgba(245,158,11,.4)}
  .dims{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .dims button{background:var(--bg2);border:1px solid var(--line);color:var(--sub);padding:9px 15px;border-radius:10px;font:700 13px "Inter";cursor:pointer}
  .dims button:hover{color:var(--ink)} .dims button.active{background:rgba(124,92,255,.18);border-color:var(--purple2);color:var(--purple)}
  .stat .f{font-size:10.5px;color:var(--sub);margin-top:7px;line-height:1.3;opacity:.8}
  .stat .pc{font-size:15px;font-weight:800;margin-top:7px;color:var(--purple);font-variant-numeric:tabular-nums} .stat .pc small{font-size:11px;font-weight:600;color:var(--sub);margin-left:4px}
  .stat.pend{opacity:.55} .stat.pend .v{font-size:15px;color:var(--sub)}
  .pendtag{font-size:9.5px;font-weight:800;color:var(--amber);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:20px;padding:1px 7px;margin-left:6px;white-space:nowrap}
  .esttag{font-size:9.5px;font-weight:800;color:var(--cyan);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);border-radius:20px;padding:1px 7px;margin-left:6px;white-space:nowrap}
  table.mx{width:auto;min-width:100%}
  table.mx th:first-child,table.mx td:first-child{position:sticky;left:0;z-index:1;background:var(--bg1);min-width:230px;max-width:260px;white-space:normal}
  table.mx th:first-child{background:var(--bg2)}
  table.mx tr.sh td{background:var(--bg2);color:var(--purple);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left}
  table.mx td.tot,table.mx th.tot{background:rgba(124,92,255,.08)}
  table.mx th{white-space:normal;max-width:140px;vertical-align:bottom}
  td.neg{color:var(--red)} td.pos{color:var(--green)} td.na{color:var(--sub);font-weight:400}
  .rng{display:flex;gap:6px;align-items:center}
  .rng input{background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:9px;font:600 12.5px "Inter";color-scheme:dark}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
  .pgrid .field{margin:0}
  .pgrid .field small{display:block;color:var(--sub);font-size:10.5px;margin-top:4px}
  .scen th.c-cons{color:var(--orange)} .scen th.c-base{color:var(--purple)} .scen th.c-opt{color:var(--green)}
  .big{font-size:13px;line-height:1.55;color:var(--sub)} .big b{color:var(--ink)}
  .cfgtbl input,.cfgtbl select{background:var(--bg3);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 8px;font:600 12.5px "Inter";outline:none}
  .cfgtbl input{width:110px;text-align:right}
  @media(max-width:820px){.main{padding:18px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="lg">📊</div><div><h1>Métricas Tienda</h1><p>Dropi · Meta · Shopify</p></div></div>
    <nav class="nav">
      <a class="active" id="nav-metricas" onclick="go('metricas')">📊 Métricas</a>
      <a id="nav-proy" onclick="go('proy')">🔮 Proyecciones</a>
      <div class="sep"></div>
      <a id="nav-config" onclick="go('config')">⚙️ Configuración</a>
    </nav>
  </aside>

  <main class="main">
    <div class="syncbar" id="syncbar"></div>
    <div id="rangebar">
      <div class="filters" id="filters">
        <button data-r="total" onclick="setRange('total')">Total</button>
        <button data-r="hoy" onclick="setRange('hoy')">Hoy</button>
        <button data-r="ayer" onclick="setRange('ayer')">Ayer</button>
        <button data-r="7d" onclick="setRange('7d')">7 días</button>
        <button data-r="14d" onclick="setRange('14d')">14 días</button>
        <button data-r="30d" class="active" onclick="setRange('30d')">30 días</button>
        <button data-r="mes" onclick="setRange('mes')">Este mes</button>
        <button data-r="mesant" onclick="setRange('mesant')">Mes anterior</button>
        <label class="drange" title="Elegir rango de fechas"><span class="ic">📅</span><input id="r-range" readonly placeholder="Elegir fechas"><span class="car">▾</span></label>
        <input type="hidden" id="r-from"><input type="hidden" id="r-to">
      </div>
    </div>
    <div id="view-metricas"></div>
    <div id="view-proy" style="display:none"></div>
    <div id="view-config" style="display:none"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="tip"></div>

<script>
const $=s=>document.querySelector(s);
let ORDERS=[],META=[],CFG={},SYNC={},META_LIVE=false,SHOP={orders:[],drafts:[]};
let VIEW='metricas',DIM='general',RANGE={type:'30d'};
const DEFAULT_FLETES={ENVIA:17450,COORDINADORA:21800,INTERRAPIDISIMO:20800,TCC:19500,SERVIENTREGA:19500,DOMINA:19500,VELOCES:19500};
const CIUDADES=['BOGOTA','MEDELLIN','CALI','BARRANQUILLA','CARTAGENA','BUCARAMANGA'];

// ───── formato ─────
const fN=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('es-CO');
const f$=v=>v==null||!isFinite(v)?'—':(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('es-CO');
const fP=v=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('es-CO',{maximumFractionDigits:1})+'%';
const fX=v=>v==null||!isFinite(v)?'—':v.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+'x';
const fD=v=>v==null||!isFinite(v)?'—':v.toLocaleString('es-CO',{maximumFractionDigits:1})+' días';
const FMT={n:fN,'$':f$,'%':fP,x:fX,d:fD};
const div=(a,b)=>b?a/b:null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const strip=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
const isWeekend=f=>{const g=new Date(f+'T12:00:00').getDay();return g===0||g===6;};
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ───── estados ─────
const isCanc=o=>/CANCEL|RECHAZ|ANULAD/.test(o.estado||'');
const isEnt=o=>(o.estado||'')==='ENTREGADO';
const isDev=o=>/DEVOLU/.test(o.estado||'');
const units=o=>o.unidades||1;
const fleteEst=o=>{const t=(o.transportadora||'').toUpperCase();const c=(CFG.fletes||{})[t];return c!=null&&c!==''?+c:(DEFAULT_FLETES[t]||+(CFG.flete_default||19500));};
const flete=o=>o.flete>0?o.flete:o.flete_cot>0?o.flete_cot:fleteEst(o); // real (Excel) → cotizado en Dropi → estimado
const devFlete=o=>o.dev_flete>0?o.dev_flete:flete(o)*(CFG.dev_factor!=null?+CFG.dev_factor:1);
const anyEst=L=>L.some(o=>!(o.flete>0||o.flete_cot>0));
// lo que entra/sale de la billetera de Dropi por pedido (como la columna de Dropi): entregado = venta − proveedor − flete; devolución = −(flete + flete de retorno)
const recibido=o=>isEnt(o)?(o.venta||0)-(o.proveedor||0)-flete(o):isDev(o)?-(flete(o)+devFlete(o)):null;

// ───── rango de fechas ─────
function rangeDates(){
  const t=today(),r=RANGE.type;
  if(r==='hoy')return{from:t,to:t};
  if(r==='ayer'){const y=addDays(t,-1);return{from:y,to:y};}
  if(r==='7d')return{from:addDays(t,-6),to:t};
  if(r==='14d')return{from:addDays(t,-13),to:t};
  if(r==='30d')return{from:addDays(t,-29),to:t};
  if(r==='mes')return{from:t.slice(0,8)+'01',to:t};
  if(r==='mesant'){const d=new Date(t.slice(0,8)+'01T12:00:00');d.setDate(0);const e=iso(d);return{from:e.slice(0,8)+'01',to:e};}
  if(r==='custom')return{from:$('#r-from').value||'2000-01-01',to:$('#r-to').value||t};
  return{from:'2000-01-01',to:'2999-12-31'};
}
function setRange(type){RANGE={type};document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.r===type));
  if(type!=='custom'){const r=rangeDates();$('#r-from').value=type==='total'?'':r.from;$('#r-to').value=type==='total'?'':r.to;
    if(window._fp){if(type==='total')_fp.clear(false);else _fp.setDate([r.from,r.to],false);}} // el calendario muestra el rango elegido
  render();}
const inRange=(f,r)=>f&&f>=r.from&&f<=r.to;

// ───── productos: Meta (nombre de campaña) → producto de Dropi ─────
const toks=s=>strip(s).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!STOP.has(w));
const STOP=new Set(['PARA','CON','DEL','LAS','LOS','UNA','PACK','COMBO']);
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
let _pmap=null;
function dropiProducts(){const s=new Set();ORDERS.forEach(o=>{if(o.producto)s.add(o.producto);});return[...s].sort();}
function metaProducts(){return[...new Set(META.map(m=>m.producto))].sort();}
function autoMatch(mp){
  const mt=toks(mp);let best=null,bs=0;
  for(const dp of dropiProducts()){const dt=toks(dp);let s=0;mt.forEach(a=>{if(dt.some(b=>a===b||(a.length>=5&&lev(a,b)<=(a.length>=7?2:1))))s++;});if(s>bs){bs=s;best=dp;}}
  return best;
}
function prodMap(){
  if(_pmap)return _pmap;_pmap={};const man=CFG.prod_map||{};
  metaProducts().forEach(mp=>{_pmap[mp]=man[mp]!==undefined&&man[mp]!==''?man[mp]:(autoMatch(mp)||mp);});
  return _pmap;
}
const metaProd=m=>prodMap()[m.producto]||m.producto;

// ───── ciudades ─────
function cityKey(o){const c=strip(o.ciudad);for(const k of CIUDADES)if(c.startsWith(k))return k==='BOGOTA'?'BOGOTÁ':k==='MEDELLIN'?'MEDELLÍN':k;return'OTRAS CIUDADES';}

// ───── cálculo de métricas para un grupo ─────
function calc(L,mt,sh){
  const sum=(a,f)=>a.reduce((s,o)=>s+(+f(o)||0),0);
  const comp=L.length,canc=L.filter(isCanc),desp=L.filter(o=>!isCanc(o)),ent=L.filter(isEnt),dev=L.filter(isDev);
  const fin=ent.concat(dev); // pedidos cerrados (ya cobraron flete)
  const antic=L.filter(o=>o.anticipado&&!isCanc(o));
  const factDesp=sum(desp,o=>o.venta),factEnt=sum(ent,o=>o.venta),valDropi=sum(L,o=>o.venta);
  const ingresado=sum(fin,recibido);
  const cProv=sum(ent,o=>o.proveedor),cTransp=sum(fin,flete),cDev=sum(dev,devFlete);
  const inv=mt.inv||0,costos=inv+cTransp+cProv+cDev,gan=ingresado-inv; // = facturación entregada − costos totales
  const u2=L.filter(o=>units(o)===2).length,u3=L.filter(o=>units(o)===3).length,um=L.filter(o=>units(o)>=2).length;
  const sub=(A)=>{const c=A.filter(isCanc).length,d=A.length-c,e=A.filter(isEnt).length,v=A.filter(isDev).length;return{n:A.length,c,d,e,v};};
  const of=sub(L.filter(o=>o.oficina)),cm=sub(L.filter(o=>o.comentarios));
  const tdel=ent.map(o=>o.fecha_entrega&&o.fecha?(new Date(o.fecha_entrega)-new Date(o.fecha))/864e5:null).filter(x=>x!=null&&x>=0);
  const PL=L.filter(o=>o.origen==='preliminar'),SL=L.filter(o=>o.origen==='shopify');
  const pd=PL.filter(o=>!isCanc(o)),sd=SL.filter(o=>!isCanc(o)),valPrelim=sum(PL,o=>o.venta);
  const shop={ventas:sh?sh.orders.filter(o=>!o.cancelled).length:SL.length,prelim:sh?sh.drafts.filter(d=>d.valido).length:null,prelimConvD:sh?sh.drafts.filter(d=>d.valido&&d.dropi_id).length:null,
    conv:PL.length,valPrelim,efPrelim:div(pd.filter(isEnt).length,pd.length),efMeta:div(sd.filter(isEnt).length,sd.length),manual:L.filter(o=>o.origen==='manual').length};
  // pedidos en camino: ganancia que traerían (venta − proveedor − flete) y la esperada con la efectividad de los ya cerrados
  const procL=desp.filter(o=>!isEnt(o)&&!isDev(o)),efC=fin.length?ent.length/fin.length:0.75;
  const ganProc=sum(procL,o=>(o.venta||0)-(o.proveedor||0)-flete(o)),ganProcEsp=sum(procL,o=>efC*((o.venta||0)-(o.proveedor||0)-flete(o))-(1-efC)*(flete(o)+devFlete(o)));
  return{recEnt:sum(ent,recibido),recDev:sum(dev,recibido),ganProc,ganProcEsp,efC,shop,comp,canc:canc.length,desp:desp.length,ent:ent.length,dev:dev.length,proc:desp.length-ent.length-dev.length,
    ventasMeta:mt.ventas||0,factMeta:mt.fac||0,inv,prorr:mt.prorr,valDropi,factDesp,factEnt,ingresado,cProv,cTransp,cDev,costos,gan,
    fleteProm:div(cTransp,fin.length),fleteDevProm:div(cDev,dev.length),provProm:div(cProv,ent.length),
    u2,u3,um,uni:sum(L,units),of,cm,antic:antic.length,anticVal:sum(antic,o=>o.venta),tdel:tdel.length?tdel.reduce((a,b)=>a+b,0)/tdel.length:null,est:anyEst(fin)};
}
const P='shopify'; // métricas que dependen de Shopify (conector pendiente)
const METRICS=[
 {s:'📦 Pedidos'},
 {l:'Pedidos completos',f:m=>m.comp,t:'n',d:'Todos los pedidos de Dropi'},
 {l:'Pedidos cancelados',f:m=>m.canc,t:'n',d:'Estado cancelado'},
 {l:'Pedidos despachados',f:m=>m.desp,t:'n',d:'Completos − cancelados'},
 {l:'Pedidos entregados',f:m=>m.ent,t:'n',d:'Estado entregado'},
 {l:'Pedidos devueltos',f:m=>m.dev,t:'n',d:'Estado devolución'},
 {l:'En proceso (sin cerrar)',f:m=>m.proc,t:'n',d:'Despachados que aún no se entregan ni devuelven'},
 {l:'% de efectividad',f:m=>div(m.ent,m.desp),t:'%',d:'Entregados ÷ despachados'},
 {l:'% de cancelación',f:m=>div(m.canc,m.comp),t:'%',d:'Cancelados ÷ completos'},
 {l:'% de devoluciones',f:m=>div(m.dev,m.desp),t:'%',d:'Devueltos ÷ despachados'},
 {l:'% despachados',f:m=>div(m.desp,m.comp),t:'%',d:'Despachados ÷ completos'},
 {s:'🛒 Ventas'},
 {l:'Ventas de Meta',f:m=>m.ventasMeta,t:'n',d:'Compras atribuidas por Meta'},
 {l:'Ventas Shopify',f:m=>m.shop.ventas,t:'n',d:'Pedidos que entraron por la tienda Shopify'},
 {l:'Ventas Dropi sin preliminares',f:m=>m.comp-m.shop.conv,t:'n',d:'Ventas Dropi − preliminares recuperados'},
 {l:'Preliminar recuperado',f:m=>m.shop.conv,t:'n',d:'Pedidos de Dropi que salieron de un preliminar (mismo teléfono)'},
 {l:'Ventas en Dropi',f:m=>m.comp,t:'n',d:'Pedidos registrados en Dropi'},
 {l:'% efectividad ventas Meta',f:m=>m.shop.efMeta,t:'%',d:'Entregados ÷ despachados de los pedidos que entraron por la tienda (tráfico de Meta)'},
 {l:'Pedidos manuales',f:m=>m.shop.manual,t:'n',d:'En Dropi sin pedido de Shopify ni preliminar'},
 {s:'🎯 CPA'},
 {l:'CPA Meta',f:m=>div(m.inv,m.ventasMeta),t:'$',d:'Inversión ÷ ventas Meta'},
 {l:'% CPA Meta',f:m=>div(m.inv,m.factMeta),t:'%',d:'Inversión ÷ valor de conversión Meta'},
 {l:'CPA Dropi',f:m=>div(m.inv,m.comp),t:'$',d:'Inversión ÷ ventas en Dropi'},
 {l:'% CPA Dropi',f:m=>div(m.inv,m.valDropi),t:'%',d:'Inversión ÷ valor de ventas Dropi'},
 {l:'CPA despachado',f:m=>div(m.inv,m.desp),t:'$',d:'Inversión ÷ despachados'},
 {l:'CPA entregado',f:m=>div(m.inv,m.ent),t:'$',d:'Inversión ÷ entregados'},
 {s:'🧾 Preliminares'},
 {l:'Preliminares total',f:m=>m.shop.prelim,t:'n',d:'Pedidos preliminares de Shopify (checkouts abandonados del formulario), sin duplicados'},
 {l:'Preliminar recuperado',f:m=>m.shop.conv,t:'n',d:'Pedidos de Dropi que salieron de un preliminar'},
 {l:'% conversión preliminar',f:m=>m.shop.prelim==null?null:div(m.shop.prelimConvD,m.shop.prelim),t:'%',d:'Preliminares recuperados ÷ preliminares'},
 {l:'% efectividad preliminar',f:m=>m.shop.efPrelim,t:'%',d:'Entregados ÷ despachados de los preliminares que están en Dropi'},
 {s:'💵 ROAS'},
 {l:'Inversión',f:m=>m.inv,t:'$',d:'Gasto total en Meta'},
 {l:'Facturación Meta',f:m=>m.factMeta,t:'$',d:'Valor de conversión de Meta'},
 {l:'Facturación incluyendo preliminares',f:m=>m.factMeta+m.shop.valPrelim,t:'$',d:'Fact. Meta + valor de preliminares recuperados'},
 {l:'Facturación despachada',f:m=>m.factDesp,t:'$',d:'Valor de pedidos despachados'},
 {l:'Facturación entregada',f:m=>m.factEnt,t:'$',d:'Valor de pedidos entregados'},
 {r:1},
 {l:'ROAS Meta',f:m=>div(m.factMeta,m.inv),t:'x',d:'Facturación Meta ÷ inversión'},
 {l:'ROAS entregado',f:m=>div(m.factEnt,m.inv),t:'x',d:'Facturación entregada ÷ inversión'},
 {l:'ROAS recolectado',f:m=>div(m.ingresado,m.inv),t:'x',d:'Dinero ingresado a Dropi ÷ inversión'},
 {l:'ROAS incluyendo preliminares',f:m=>div(m.factMeta+m.shop.valPrelim,m.inv),t:'x',d:'(Fact. Meta + preliminares recuperados) ÷ inversión'},
 {l:'ROAS despachado',f:m=>div(m.factDesp,m.inv),t:'x',d:'Facturación despachada ÷ inversión'},
 {r:1},
 {l:'% recolectado',f:m=>div(m.ingresado,m.factDesp),t:'%',d:'Dinero ingresado ÷ facturación despachada'},
 {s:'💰 Rentabilidad',est:true},
 {l:'Dinero ingresado a Dropi',f:m=>m.ingresado,t:'$',d:'Lo que entra a Dropi: entregados (venta − proveedor − flete) menos fletes de devoluciones'},
 {l:'Costo de proveedores',f:m=>m.cProv,t:'$',d:'Precio proveedor de los entregados'},
 {l:'Costo de transportadora',f:m=>m.cTransp,t:'$',d:'Fletes de entregados y devueltos',e:1},
 {l:'Costo de devoluciones',f:m=>m.cDev,t:'$',d:'Flete de retorno de devueltos',e:1},
 {l:'Inversión publicitaria',f:m=>m.inv,t:'$',d:'Inversión total en Meta'},
 {l:'Costos totales',f:m=>m.costos,t:'$',d:'Inversión + transportadora + proveedores + devoluciones'},
 {r:1},
 {l:'Ganancia neta',f:m=>m.gan,t:'$',d:'Dinero ingresado a Dropi − inversión',sign:1},
 {l:'Ganancia neta por pedido entregado',f:m=>div(m.gan,m.ent),t:'$',d:'Ganancia neta ÷ entregados',sign:1},
 {l:'% Margen neto',f:m=>div(m.gan,m.ingresado),t:'%',d:'Ganancia neta ÷ dinero ingresado',sign:1},
 {s2:'Promedios'},
 {l:'Ingreso promedio por pedido entregado',f:m=>div(m.ingresado,m.ent),t:'$',d:'Dinero ingresado ÷ entregados'},
 {l:'Flete promedio',f:m=>m.fleteProm,t:'$',d:'Costo transportadora ÷ pedidos cerrados',e:1},
 {l:'Flete promedio de devolución',f:m=>m.fleteDevProm,t:'$',d:'Costo devoluciones ÷ devueltos',e:1},
 {l:'Costo promedio de proveedor',f:m=>m.provProm,t:'$',d:'Costo proveedores ÷ entregados'},
 {s:'🧺 Unidades'},
 {l:'Pedidos de 2 unidades',f:m=>m.u2,t:'n'},
 {l:'Pedidos de 3 unidades',f:m=>m.u3,t:'n'},
 {l:'% de compras dobles',f:m=>div(m.u2,m.comp),t:'%'},
 {l:'% de compras triples',f:m=>div(m.u3,m.comp),t:'%'},
 {l:'% de compras de 2 o más',f:m=>div(m.um,m.comp),t:'%'},
 {l:'Unidades vendidas',f:m=>m.uni,t:'n'},
 {s:'🏢 Pedidos a oficina'},
 {l:'Pedidos a oficina',f:m=>m.of.n,t:'n',d:'Dirección dice "oficina"'},
 {l:'% pedidos a oficina',f:m=>div(m.of.n,m.comp),t:'%'},
 {l:'Cancelados oficina',f:m=>m.of.c,t:'n'},
 {l:'Despachados oficina',f:m=>m.of.d,t:'n'},
 {l:'Entregados oficina',f:m=>m.of.e,t:'n'},
 {l:'Devueltos oficina',f:m=>m.of.v,t:'n'},
 {l:'% efectividad oficina',f:m=>div(m.of.e,m.of.d),t:'%'},
 {l:'% cancelación oficina',f:m=>div(m.of.c,m.of.n),t:'%'},
 {l:'% devoluciones oficina',f:m=>div(m.of.v,m.of.d),t:'%'},
 {s:'💬 Ventas por comentarios'},
 {l:'Ventas comentarios',f:m=>m.cm.n,t:'n',d:'Pedidos con etiqueta de comentarios de Facebook'},
 {l:'Entregados comentarios',f:m=>m.cm.e,t:'n'},
 {l:'Devueltos comentarios',f:m=>m.cm.v,t:'n'},
 {l:'% efectividad comentarios',f:m=>div(m.cm.e,m.cm.n),t:'%',d:'Entregados ÷ completos comentarios'},
 {l:'% cancelación comentarios',f:m=>div(m.cm.c,m.cm.n),t:'%'},
 {l:'% devoluciones comentarios',f:m=>div(m.cm.v,m.cm.n),t:'%'},
 {s:'💳 Pagos anticipados'},
 {l:'Pedidos con pago anticipado',f:m=>m.antic,t:'n',d:'Sin recaudo (no pagan contraentrega)'},
 {l:'% pagos anticipados',f:m=>div(m.antic,m.comp),t:'%'},
 {l:'Recaudado pagos anticipados',f:m=>m.anticVal,t:'$'},
 {s:'🚚 Logística'},
 {l:'Tiempo promedio de entrega',f:m=>m.tdel,t:'d',d:'Fecha de entrega − fecha de creación (Dropi no da la fecha de entrega: se mide con la sincronización diaria)'},
];

// ───── agrupación por dimensión ─────
const DIMS=[['general','General'],['producto','Por producto'],['ciudad','Ciudades principales'],['transp','Por transportadora'],['semana','Fin de semana vs entre semana'],['dia','Por día']];
function groupsFor(dim,L,M){
  // devuelve [{name, list, mt}]
  const metaSum=rows=>({inv:rows.reduce((s,m)=>s+m.inversion,0),ventas:rows.reduce((s,m)=>s+m.ventas,0),fac:rows.reduce((s,m)=>s+m.facturacion,0)});
  const tot=metaSum(M);
  const by=(keyO,keyM)=>{const g={};L.forEach(o=>{const k=keyO(o);(g[k]=g[k]||{name:k,list:[],meta:[]}).list.push(o);});
    if(keyM)M.forEach(m=>{const k=keyM(m);(g[k]=g[k]||{name:k,list:[],meta:[]}).meta.push(m);});
    return Object.values(g).map(x=>({name:x.name,list:x.list,mt:keyM?metaSum(x.meta):{inv:div(x.list.length,L.length)*tot.inv||0,ventas:div(x.list.length,L.length)*tot.ventas||0,fac:div(x.list.length,L.length)*tot.fac||0,prorr:1}}));};
  if(dim==='producto')return by(o=>o.producto||'Sin producto',metaProd).sort((a,b)=>b.list.length-a.list.length||b.mt.inv-a.mt.inv);
  if(dim==='ciudad'){const order=['BOGOTÁ','MEDELLÍN','CALI','BARRANQUILLA','CARTAGENA','BUCARAMANGA','OTRAS CIUDADES'];return by(cityKey).sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));}
  if(dim==='transp')return by(o=>o.transportadora||'—').sort((a,b)=>b.list.length-a.list.length);
  if(dim==='semana'){const w=f=>isWeekend(f)?'Fin de semana (sáb-dom)':'Entre semana (lun-vie)';return by(o=>w(o.fecha),m=>w(m.fecha)).sort((a,b)=>a.name<b.name?-1:1);}
  if(dim==='dia')return by(o=>o.fecha,m=>m.fecha).sort((a,b)=>a.name<b.name?1:-1).map(g=>({...g,label:DOW[new Date(g.name+'T12:00:00').getDay()]+' '+g.name.slice(5).split('-').reverse().join('/')}));
  return[];
}

// ───── render Métricas ─────
function syncbar(){
  const ago=s=>{if(!s)return'nunca';const h=(Date.now()-new Date(s))/36e5;return h<1?'hace '+Math.max(1,Math.round(h*60))+' min':h<48?'hace '+Math.round(h)+' h':'hace '+Math.round(h/24)+' días';};
  const cls=s=>!s?'warn':(Date.now()-new Date(s))/36e5<30?'ok':'warn';
  $('#syncbar').innerHTML=`<span class="chip ${cls(SYNC.dropi)}">🟣 Dropi: ${ago(SYNC.dropi)}</span><span class="chip ${cls(SYNC.meta)}">🔵 Meta: ${ago(SYNC.meta)}</span><span class="chip ${cls(SYNC.shopify)}">🟢 Shopify: ${ago(SYNC.shopify)}</span><span style="opacity:.7">${ORDERS.length} pedidos · ${META.length} filas de Meta · ${SHOP.orders.length} pedidos Shopify</span>`;
}
function render(){
  syncbar();
  $('#rangebar').style.display=VIEW==='config'?'none':'';
  if(VIEW==='metricas')renderMetricas();else if(VIEW==='proy')renderProy();else renderConfig();
}
function renderMetricas(){
  const r=rangeDates();
  const L=ORDERS.filter(o=>inRange(o.fecha,r)),M=META.filter(m=>inRange(m.fecha,r));
  const dimsH=`<div class="dims">${DIMS.map(([k,n])=>`<button class="${DIM===k?'active':''}" onclick="DIM='${k}';renderMetricas()">${n}</button>`).join('')}</div>`;
  const head=`<h2 class="title">📊 Métricas</h2><p class="muted">${r.from==='2000-01-01'?'Todo el histórico':r.from+' → '+r.to} · datos directos de Dropi y Meta (sin subir reportes).</p>`;
  if(!L.length&&!M.length){$('#view-metricas').innerHTML=head+dimsH+'<div class="empty">No hay pedidos ni inversión en este rango.</div>';return;}
  const SH={orders:SHOP.orders.filter(o=>inRange(o.fecha,r)),drafts:SHOP.drafts.filter(d=>inRange(d.fecha,r))};
  const tot=calc(L,{inv:M.reduce((s,m)=>s+m.inversion,0),ventas:M.reduce((s,m)=>s+m.ventas,0),fac:M.reduce((s,m)=>s+m.facturacion,0)},SH);
  let body='';
  if(DIM==='general'){
    // métricas principales (las demás quedan en "Ver todas las métricas")
    const KEY=[['Inversión','$',m=>m.inv,'Gasto total en Meta'],['Ventas Meta','n',m=>m.ventasMeta,'Compras atribuidas por Meta'],['CPA','$',m=>div(m.inv,m.ventasMeta),'Inversión ÷ ventas Meta · % CPA = inversión ÷ facturación Meta',0,['% CPA',m=>div(m.inv,m.factMeta)]],
      ['ROAS Meta','x',m=>div(m.factMeta,m.inv),'Facturación Meta ÷ inversión'],['Dinero ingresado a Dropi','$',m=>m.ingresado,m=>`${m.ent} entregados (venta − proveedor − flete): ${f$(m.recEnt)} · ${m.dev} devoluciones (flete ida y vuelta): −${f$(Math.abs(m.recDev))}`],['Ganancia neta','$',m=>m.gan,'Dinero ingresado a Dropi − inversión',1],['% Utilidad','%',m=>div(m.gan,m.ingresado),'Ganancia neta ÷ dinero ingresado a Dropi',1],
      ['Entregados','n',m=>m.ent,'Efectividad = entregados ÷ despachados',0,['efectividad',m=>div(m.ent,m.desp)]],['Cancelados','n',m=>m.canc,'Cancelación = cancelados ÷ completos',0,['cancelación',m=>div(m.canc,m.comp)]],
      ['Devoluciones','n',m=>m.dev,'Devolución = devueltos ÷ despachados',0,['devolución',m=>div(m.dev,m.desp)]],['En procesamiento','n',m=>m.proc,'Despachados que aún no se entregan ni devuelven'],
      ['Ganancia en procesamiento','$',m=>m.ganProc,m=>`Si se entregan todos los en camino (venta − proveedor − flete). Esperada con tu efectividad de ${fP(m.efC)}: ${f$(m.ganProcEsp)}`,1]];
    body+='<div class="cards" style="margin-top:6px">'+KEY.map(([l,t,f,d,sg,pc])=>{const v=f(tot);return`<div class="stat ${sg?(v<0?'red':'grn'):''}"><div class="k">${l}</div><div class="v">${FMT[t](v)}</div>${pc?`<div class="pc">${fP(pc[1](tot))}<small>${pc[0]}</small></div>`:''}<div class="f">${typeof d==='function'?d(tot):d}</div></div>`;}).join('')+'</div>';
    body+=renderDetalle(tot,L,M,SH);
  }else{
    const shKey=DIM==='dia'?(f=>f):DIM==='semana'?(f=>isWeekend(f)?'Fin de semana (sáb-dom)':'Entre semana (lun-vie)'):null;
    const G=groupsFor(DIM,L,M).map(g=>({...g,m:calc(g.list,g.mt,shKey?{orders:SH.orders.filter(o=>shKey(o.fecha)===g.name),drafts:SH.drafts.filter(d=>shKey(d.fecha)===g.name)}:null)}));
    const prorr=G.some(g=>g.mt.prorr);
    const note=prorr?`<div class="hint">La inversión de Meta no se puede separar por ${DIM==='ciudad'?'ciudad':'transportadora'}: se reparte proporcional a los pedidos de cada grupo (CPA/ROAS de esta vista son aproximados).</div>`:
      DIM==='producto'?`<div class="hint">La inversión de Meta se asigna al producto según el nombre de la campaña. Si algún producto no casa bien, ajústalo en ⚙️ Configuración → Productos.</div>`:'';
    let h=`<div class="tablewrap"><table class="mx"><thead><tr><th>Métrica</th><th class="tot">Total</th>${G.map(g=>`<th>${g.label||g.name}</th>`).join('')}</tr></thead><tbody>`;
    METRICS.forEach(d=>{
      if(d.r)return;
      if(d.s||d.s2){h+=`<tr class="sh"><td colspan="${G.length+2}">${d.s||d.s2}</td></tr>`;return;}
      if(d.p){h+=`<tr><td>${d.l}<span class="pendtag">Shopify</span></td><td class="na tot">—</td>${G.map(()=>'<td class="na">—</td>').join('')}</tr>`;return;}
      const cell=(m,cls)=>{const v=d.f(m);const c=d.sign&&v!=null?(v<0?'neg':'pos'):'';return`<td class="num ${c} ${cls||''}">${FMT[d.t](v)}</td>`;};
      h+=`<tr><td title="${d.d||''}">${d.l}</td>${cell(tot,'tot')}${G.map(g=>cell(g.m)).join('')}</tr>`;
    });
    body=note+h+'</tbody></table></div>';
  }
  $('#view-metricas').innerHTML=head+dimsH+body;
  initCharts();
}

// ───── Gráficas interactivas (ECharts) ─────
// Paleta categórica validada para el fondo oscuro: azul, naranja, aqua, amarillo. Estados: bueno/alerta/serio/crítico.
const CC={b:'#3987e5',o:'#d95926',a:'#199e70',y:'#c98500',v:'#9085e9',good:'#0ca30c',warn:'#fab219',ser:'#ec835a',crit:'#d03b3b',gray:'#5b5870'};
const fM=v=>{if(v==null||!isFinite(v))return'—';const a=Math.abs(v),s=v<0?'-$':'$';return a>=1e6?s+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:2})+'M':a>=1e3?s+Math.round(a/1e3)+'k':s+Math.round(a);};
let EC_Q=[],EC_I=[];
function ec(id,opt,h){EC_Q.push([id,opt]);return`<div id="${id}" class="ec" style="height:${h||300}px"></div>`;}
function initCharts(){
  EC_I.forEach(c=>{try{c.dispose()}catch(e){}});EC_I=[];
  if(!window.echarts){EC_Q=[];return;}
  EC_Q.forEach(([id,opt])=>{const el=document.getElementById(id);if(!el)return;const c=echarts.init(el,null,{renderer:'canvas'});c.setOption(Object.assign({
    backgroundColor:'transparent',animationDuration:900,animationEasing:'cubicOut',
    textStyle:{fontFamily:'Inter',color:'#948fb0'},
    tooltip:{backgroundColor:'#1c1b2a',borderColor:'#2a2840',textStyle:{color:'#ece9f5',fontSize:12},extraCssText:'border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5)'},
  },opt));EC_I.push(c);});
  EC_Q=[];
}
window.addEventListener('resize',()=>EC_I.forEach(c=>c.resize()));
const box=(title,sub,inner,full)=>`<div class="chartcard"${full?' style="grid-column:1/-1"':''}><div class="charttitle">${title}</div>${sub?`<div class="chartsub">${sub}</div>`:''}${inner}</div>`;
const AX={axisLine:{lineStyle:{color:'#2a2840'}},axisTick:{show:false},axisLabel:{color:'#948fb0',fontSize:11},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}};
const LEG={textStyle:{color:'#948fb0',fontSize:12},itemWidth:12,itemHeight:12,icon:'roundRect',top:0};
const grad=(c)=>({type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:c+'66'},{offset:1,color:c+'05'}]});
// dona con texto al centro
function donut(id,data,center,sub,h,money){
  return ec(id,{tooltip:{trigger:'item',formatter:p=>`<b>${p.name}</b><br>${money?f$(p.value):fN(p.value)} · ${p.percent}%`},legend:{...LEG,top:'bottom',show:!money},

      label:money?{show:true,position:'outside',color:'#ece9f5',fontWeight:700,fontSize:12,lineHeight:16,width:120,overflow:'break',formatter:p=>[p.name,fP(p.percent/100)+' · '+fM(p.value)].join('\n')}:{show:true,color:'#ece9f5',formatter:p=>p.value?`${p.value}`:'',fontWeight:700},labelLine:{length:8,length2:6},
      emphasis:{scale:true,scaleSize:8,label:{fontSize:14}},data:data.filter(d=>d.value>0).map(d=>({name:d.name,value:d.value,itemStyle:{color:d.c}}))}]},h||300);

      emphasis:{label:{fontSize:15}},data:data.map(d=>({name:d.name,value:d.value,itemStyle:{color:d.c}}))}]},h||260);

// medidores de %
function gauges(id,items,h){

    title:{offsetCenter:[0,'42%'],color:'#948fb0',fontSize:12},detail:{offsetCenter:[0,'0%'],valueAnimation:true,color:'#ece9f5',fontSize:26,fontWeight:800,formatter:v=>v==null?'—':v.toLocaleString('es-CO',{maximumFractionDigits:1})+'%'},
    data:[{value:g.v==null?0:+(g.v*100).toFixed(1),name:g.name}]}))},h||230);
}
// serie diaria: barras apiladas + líneas, con zoom

      :{name:s.n,type:'line',smooth:.35,symbol:'circle',symbolSize:7,showSymbol:days.length<=31,data:s.v,connectNulls:false,lineStyle:{width:3,color:s.c,type:s.dash?'dashed':'solid'},itemStyle:{color:s.c,borderColor:'#101019',borderWidth:2},

// detalle de General: cada sección con sus gráficas
function renderDetalle(m,L,M,SH){
  const msum=X=>({inv:X.reduce((s,x)=>s+x.inversion,0),ventas:X.reduce((s,x)=>s+x.ventas,0),fac:X.reduce((s,x)=>s+x.facturacion,0)});
  const ds=[...new Set([...L.map(o=>o.fecha),...M.map(x=>x.fecha)])].sort();
  const days=[];if(ds.length)for(let d=ds[0];d<=ds[ds.length-1];d=addDays(d,1))days.push(d);
  const per=days.map(d=>{const Ld=L.filter(o=>o.fecha===d),Md=msum(M.filter(x=>x.fecha===d));
    return{inv:Md.inv,vm:Md.ventas,fm:Md.fac,dropi:Ld.length,tienda:Ld.filter(o=>o.origen==='shopify').length,prel:Ld.filter(o=>o.origen==='preliminar').length,manual:Ld.filter(o=>o.origen!=='shopify'&&o.origen!=='preliminar').length,prelim:SH.drafts.filter(x=>x.fecha===d&&x.valido).length};});
  const nz=v=>v||null, sec=(t,inner)=>`<div class="sec-h">${t}</div><div class="chartgrid">${inner}</div>`;

  h+=sec('📦 Pedidos',
    box('Estado de los pedidos',`${m.comp} pedidos completos · ${m.desp} despachados (${fP(div(m.desp,m.comp))})`,donut('ch-estado',[{name:'Entregados',value:m.ent,c:CC.good},{name:'En proceso',value:m.proc,c:CC.b},{name:'Devueltos',value:m.dev,c:CC.ser},{name:'Cancelados',value:m.canc,c:CC.crit}],fP(div(m.ent,m.desp)),'efectividad'))+
    box('Embudo de pedidos',`Cancelación ${fP(div(m.canc,m.comp))} · devolución ${fP(div(m.dev,m.desp))}`,funnel('ch-embudo',[{name:'Completos',value:m.comp,c:CC.v},{name:'Despachados',value:m.desp,c:CC.b},{name:'Entregados',value:m.ent,c:CC.good}])));
  // 🛒 Ventas
  h+=sec('🛒 Ventas',
    box('Ventas por fuente','',bars('ch-ventas',['Ventas Meta','Shopify','Dropi sin preliminares','Preliminar recuperado','Ventas Dropi'],[m.ventasMeta,m.shop.ventas,m.comp-m.shop.conv,m.shop.conv,m.comp],[CC.b,CC.a,CC.o,CC.y,CC.o],fN))+
    box('¿De dónde salen los pedidos de Dropi?',`Efectividad de las ventas de la tienda: <b>${fP(m.shop.efMeta)}</b>`,donut('ch-origen',[{name:'Tienda Shopify',value:L.filter(o=>o.origen==='shopify').length,c:CC.a},{name:'Preliminar recuperado',value:m.shop.conv,c:CC.y},{name:'Manual',value:m.shop.manual,c:CC.gray}],fN(m.comp),'pedidos'))+
    (()=>{ // solo días con ventas o pauta; por día: barra de Meta al lado de la barra de Dropi (apilada por origen)
      const ix=days.map((d,i)=>i).filter(i=>per[i].dropi||per[i].vm);
      const lab=ix.map(i=>{const d=days[i];return DOW[new Date(d+'T12:00:00').getDay()]+'\n'+d.slice(8)+'/'+d.slice(5,7);});
      const col=(f)=>ix.map(i=>f(per[i])||0),tot=col(p=>p.dropi);
      const seg=(n,c,f,top)=>({name:n,type:'bar',stack:'dropi',barMaxWidth:22,barGap:'18%',data:col(f),itemStyle:{color:c,borderRadius:top?[5,5,0,0]:0},emphasis:{focus:'series'},
        label:top?{show:true,position:'top',color:'#ece9f5',fontWeight:800,fontSize:11,formatter:p=>tot[p.dataIndex]||''}:undefined});
      return box('Ventas día a día',`Por cada día: <b style="color:${CC.b}">azul</b> = compras que reporta Meta · al lado, pedidos que llegaron a Dropi (tienda, preliminar recuperado o manual). Solo días con ventas o pauta.`,
        ec('ch-ventas-dia',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`<b>${lab[p[0].dataIndex].replace('\n',' ')}</b><br>`+p.filter(x=>x.value).map(x=>`${x.marker}${x.seriesName}: <b>${x.value}</b>`).join('<br>')+`<br>Total Dropi: <b>${tot[p[0].dataIndex]}</b>`},
          legend:LEG,grid:{left:40,right:16,top:44,bottom:ix.length>20?62:20,containLabel:true},
          dataZoom:ix.length>20?[{type:'inside',start:Math.max(0,100-2000/ix.length),end:100},{type:'slider',height:16,bottom:6,start:Math.max(0,100-2000/ix.length),end:100,borderColor:'#2a2840',fillerColor:'rgba(124,92,255,.18)',handleStyle:{color:'#7c5cff'},textStyle:{color:'#948fb0'}}]:[],
          xAxis:{type:'category',data:lab,...AX,axisLabel:{...AX.axisLabel,interval:0,lineHeight:14}},yAxis:{type:'value',minInterval:1,...AX},
          series:[{name:'Ventas Meta',type:'bar',barMaxWidth:22,data:col(p=>p.vm),itemStyle:{color:CC.b,borderRadius:[5,5,0,0]},emphasis:{focus:'series'},label:{show:true,position:'top',color:'#9ec5f4',fontWeight:700,fontSize:11,formatter:p=>p.value||''}},
            seg('Tienda',CC.a,p=>p.tienda),seg('Preliminar recuperado',CC.y,p=>p.prel),seg('Manual',CC.gray,p=>p.manual,1)]},340),1);})());

// ───── Proyecciones ─────
function histBase(){
  const r=rangeDates(),L=ORDERS.filter(o=>inRange(o.fecha,r)),M=META.filter(m=>inRange(m.fecha,r));
  const m=calc(L,{inv:M.reduce((s,x)=>s+x.inversion,0),ventas:M.reduce((s,x)=>s+x.ventas,0),fac:M.reduce((s,x)=>s+x.facturacion,0)});
  const days=new Set(M.filter(x=>x.inversion>0).map(x=>x.fecha)).size||1;
  const closed=m.ent+m.dev;
  return{
    presupuesto:Math.round(m.inv/days)||100000,
    dias:30,
    cpa:Math.round(div(m.inv,m.comp)||15000),
    canc:+((div(m.canc,m.comp)||0.15)*100).toFixed(1),
    ef:+((closed?m.ent/closed:0.75)*100).toFixed(1), // efectividad sobre pedidos ya cerrados (los en camino aún no cuentan)
    ticket:Math.round(div(m.valDropi,m.comp)||100000),
    prov:Math.round(m.provProm||div(L.reduce((s,o)=>s+(o.proveedor||0),0),L.length)||40000),
    flete:Math.round(m.fleteProm||19500),
    fdev:Math.round(m.fleteDevProm||m.fleteProm||19500),
  };
}
const PF=[['presupuesto','Presupuesto diario Meta','$'],['dias','Días a proyectar',''],['cpa','CPA Dropi (inversión por pedido)','$'],['canc','% cancelación','%'],['ef','% efectividad (entregados ÷ despachados)','%'],['ticket','Ticket promedio por pedido','$'],['prov','Costo proveedor por pedido','$'],['flete','Flete promedio','$'],['fdev','Flete de devolución promedio','$']];
let PROY=null;
function proyCalc(p,adj){
  const cpa=p.cpa*(adj.cpa||1),ef=Math.min(1,Math.max(0,p.ef/100+(adj.ef||0))),canc=p.canc/100;
  const inv=p.presupuesto*p.dias,ped=cpa?inv/cpa:0,desp=ped*(1-canc),ent=desp*ef,dev=desp-ent;
  const fact=ent*p.ticket,prov=ent*p.prov,transp=(ent+dev)*p.flete,cdev=dev*p.fdev,costos=inv+prov+transp+cdev,gan=fact-costos;
  return{inv,ped,desp,ent,dev,fact,prov,transp,cdev,costos,gan,margen:div(gan,fact),roas:div(fact,inv),ganDia:gan/p.dias,ganPed:div(gan,ent)};
}
function renderProy(){
  const h=histBase();

   <div id="proy-out"></div>`;
  renderProyOut();
}
function renderProyOut(){

  const rows=[['Inversión','inv','$'],['Pedidos (ventas Dropi)','ped','n'],['Despachados','desp','n'],['Entregados','ent','n'],['Devueltos','dev','n'],['Facturación entregada','fact','$'],['Costo proveedores','prov','$'],['Costo transportadora','transp','$'],['Costo devoluciones','cdev','$'],['Costos totales','costos','$'],['Ganancia neta','gan','$',1],['Ganancia por día','ganDia','$',1],['Ganancia por pedido entregado','ganPed','$',1],['% Margen neto','margen','%',1],['ROAS entregado','roas','x']];

  $('#proy-out').innerHTML=`<div class="tablewrap"><table class="scen"><thead><tr><th>${p.dias} días · ${f$(p.presupuesto)}/día</th>${S.map(s=>`<th class="${s.c}">${s.n}</th>`).join('')}</tr></thead><tbody>

   </tbody></table></div>

   <div class="sec-h">⚖️ Punto de equilibrio</div>
   <div class="cards">
    <div class="stat ${porPed>p.cpa?'grn':'red'}"><div class="k">CPA máximo para no perder</div><div class="v">${f$(porPed)}</div><div class="f">Con tu efectividad, cancelación, ticket y costos actuales. Hoy tu CPA es ${f$(p.cpa)}.</div></div>
    <div class="stat amb"><div class="k">Efectividad mínima</div><div class="v">${efMin==null?'—':fP(efMin)}</div><div class="f">La efectividad necesaria para ganancia 0 con el CPA actual.</div></div>
   </div>
   <div class="sec-h">📅 Cierre del mes al ritmo actual (${dd}/${dim} días)</div>
   <div class="cards">
    <div class="stat"><div class="k">Pedidos del mes</div><div class="v">${fN(mm.comp*k)}</div><div class="f">Llevas ${fN(mm.comp)}</div></div>
    <div class="stat"><div class="k">Inversión del mes</div><div class="v">${f$(mm.inv*k)}</div><div class="f">Llevas ${f$(mm.inv)}</div></div>

    <div class="stat pur"><div class="k">Ganancia esperada del mes</div><div class="v">${f$(proyCalc(Object.assign({},p,{presupuesto:div(mm.inv,dd)||p.presupuesto,dias:dim,cpa:div(mm.inv,mm.comp)||p.cpa}),{}).gan)}</div><div class="f">Con el gasto y CPA del mes, y la efectividad de los supuestos</div></div>
   </div>`;
}

  <div class="sec-h">🔄 Sincronización</div>
  <div class="panel" style="max-width:820px"><p class="big">Los pedidos de <b>Dropi</b> y la inversión de <b>Meta</b> se sincronizan directo (ya no hay que subir reportes).<br>
   Última sincronización — Dropi: <b>${SYNC.dropi?new Date(SYNC.dropi).toLocaleString('es-CO'):'—'}</b> · Meta: <b>${SYNC.meta?new Date(SYNC.meta).toLocaleString('es-CO'):'—'}</b></p>
   ${META_LIVE?'<button class="btn sm" onclick="refreshMeta()">🔵 Actualizar Meta ahora</button>':'<p class="big" style="font-size:12px">Para actualizar Meta desde este botón en cualquier momento, falta agregar <b>META_TOKEN</b> en Render.</p>'}
  </div>
  <div class="sec-h">🚚 Fletes estimados por transportadora</div>
  <p class="muted">La conexión de Dropi no trae el valor del flete. Se usa el flete real cuando existe y, si no, este estimado.</p>
  <table class="cfgtbl" style="max-width:820px"><thead><tr><th>Transportadora</th><th>Flete real promedio (pedidos)</th><th>Flete estimado</th></tr></thead><tbody>
   ${tr.map(t=>`<tr><td>${t}</td><td class="num">${real(t)}</td><td><input type="number" value="${fl[t]!=null?fl[t]:(DEFAULT_FLETES[t]||CFG.flete_default||19500)}" onchange="setFlete('${t}',this.value)"></td></tr>`).join('')}
   <tr><td>Flete de devolución = flete × </td><td></td><td><input type="number" step="0.05" value="${CFG.dev_factor!=null?CFG.dev_factor:1}" onchange="saveCfg({dev_factor:+this.value})"></td></tr>
  </tbody></table>
  <div class="sec-h">📦 Productos: campaña de Meta → producto de Dropi</div>
  <p class="muted">Así se asigna la inversión de Meta a cada producto. Se empareja solo por nombre; corrígelo si hace falta.</p>
  <table class="cfgtbl" style="max-width:820px"><thead><tr><th>Producto según campañas de Meta</th><th>Inversión total</th><th>Producto en Dropi</th></tr></thead><tbody>
   ${metaProducts().map(mp=>`<tr><td>${mp}</td><td class="num">${f$(META.filter(m=>m.producto===mp).reduce((s,m)=>s+m.inversion,0))}</td><td><select onchange="setProd(${JSON.stringify(mp).replace(/"/g,'&quot;')},this.value)"><option value="${mp.replace(/"/g,'&quot;')}">— (sin producto en Dropi)</option>${dp.map(d=>`<option ${pm[mp]===d?'selected':''}>${d}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table>`;
}
async function saveCfg(patch){Object.assign(CFG,patch);_pmap=null;try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});if(!r.ok)throw 0;}catch(e){toast('No se pudo guardar');}}
async function setFlete(t,v){const f=Object.assign({},CFG.fletes||{});f[t]=+v;await saveCfg({fletes:f});toast('Flete guardado');}
async function setProd(mp,v){const m=Object.assign({},CFG.prod_map||{});m[mp]=v;await saveCfg({prod_map:m});toast('Producto asignado');}
async function refreshMeta(){toast('Actualizando Meta…');try{const r=await fetch('/api/refresh-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const j=await r.json();if(!r.ok)throw new Error(j.detail||'error');await load();toast('Meta actualizado ('+j.filas+' filas)');}catch(e){toast(e.message);}}

function go(v){VIEW=v;['metricas','proy','config'].forEach(x=>{$('#view-'+x).style.display=x===v?'':'none';$('#nav-'+x).classList.toggle('active',x===v);});render();}
async function load(){
  $('#view-metricas').innerHTML='<div class="empty">Cargando datos…</div>';
  try{
    const j=await (await fetch('/api/all')).json();
    ORDERS=(j.orders||[]).filter(o=>o&&o.id);SHOP=j.shopify||{orders:[],drafts:[]};META=j.meta||[];CFG=j.config||{};SYNC=j.sync||{};META_LIVE=!!j.metaLive;_pmap=null;
  }catch(e){$('#view-metricas').innerHTML='<div class="empty">No se pudieron cargar los datos. Si el servidor estaba dormido, espera un minuto y recarga.</div>';return;}
  setRange(RANGE.type);
}
// calendario de rango (un solo campo: inicio → fin)
if(window.flatpickr){window._fp=flatpickr('#r-range',{mode:'range',locale:(flatpickr.l10ns&&flatpickr.l10ns.es)||'default',dateFormat:'Y-m-d',altInput:true,altFormat:'j M Y',showMonths:innerWidth>820?2:1,maxDate:'today',
  onChange:(d)=>{if(d.length===2){$('#r-from').value=iso(d[0]);$('#r-to').value=iso(d[1]);setRange('custom');}}});}
load();
</script>
</body>
</html>
